<p>Soy Licenciado en Informática Administrativa, egresado de la Universidad Juárez Autónoma de Tabasco, con más de 10 años de experiencia en el área de Tecnologías de la Información. Me especializo en seguridad de la información, soporte técnico, administración de accesos, gestión de activos tecnológicos, documentación de procesos y continuidad operativa.</p>
<p>A lo largo de mi trayectoria he coordinado equipos de trabajo, capacitado personal y supervisado el cumplimiento de los niveles de servicio comprometidos con los clientes. También cuento con experiencia en mantenimiento preventivo y correctivo de equipos de cómputo, elaboración de reportes, control de inventarios, implementación de políticas, respaldos, migraciones y controles internos.</p>
<p>Me considero una persona sociable, responsable y comprometida, con facilidad para trabajar en equipo, adaptarme a nuevos retos y mantenerme en constante aprendizaje. Me apasiona la tecnología y considero que cada desafío es una oportunidad para crecer personal y profesionalmente.</p>
<p>La lealtad, la honestidad y la ética son valores fundamentales para mí: me han permitido establecer relaciones laborales positivas y desempeñar mis funciones con responsabilidad y profesionalismo. En mi tiempo libre disfruto leer y caminar, actividades que me ayudan a mantener el equilibrio y seguir desarrollándome.</p>
